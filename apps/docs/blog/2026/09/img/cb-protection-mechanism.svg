<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="thermalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#2d1b0f"/>
    </linearGradient>
    <linearGradient id="magneticGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f2942"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; letter-spacing: 1px; }
    .card-title { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }
    .card-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; }
    .body-text { font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; fill: #cbd5e1; line-height: 1.5; }
    .bold-text { font-weight: 700; fill: #f8fafc; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; }
  </style>

  <!-- Background -->
  <rect width="800" height="360" rx="16" fill="url(#bgGradient)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Header Box -->
  <g transform="translate(230, 20)">
    <rect width="340" height="48" rx="12" fill="url(#headerGrad)" stroke="#60a5fa" stroke-width="1" filter="url(#blueGlow)"/>
    <text x="170" y="29" text-anchor="middle" class="title">CƠ CHẾ BẢO VỆ CỦA CIRCUIT BREAKER</text>
  </g>

  <!-- Split Branch Lines -->
  <!-- Downward main stem -->
  <path d="M 400 68 L 400 95" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4"/>
  <!-- Horizontal splitter -->
  <path d="M 210 95 L 590 95" stroke="#94a3b8" stroke-width="2"/>
  <!-- Left branch down to Thermal -->
  <path d="M 210 95 L 210 120" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <!-- Right branch down to Magnetic -->
  <path d="M 590 95 L 590 120" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Left Card: BẢO VỆ QUÁ TẢI (Thermal Overload) -->
  <g transform="translate(40, 120)">
    <rect width="340" height="210" rx="14" fill="url(#thermalGrad)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.8"/>
    
    <!-- Header Badge -->
    <rect x="16" y="16" width="308" height="36" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="36" cy="34" r="10" fill="#f59e0b"/>
    <path d="M 36 28 L 36 40 M 31 34 L 41 34" stroke="#ffffff" stroke-width="2"/>
    <text x="56" y="32" class="card-title" fill="#fbbf24">BẢO VỆ QUÁ TẢI (Thermal Overload)</text>
    <text x="56" y="44" class="card-sub" fill="#f59e0b">Dòng điện nhẹ quá mức duy trì tục</text>

    <!-- Details Bullet Points -->
    <g transform="translate(20, 75)">
      <!-- Bullet 1 -->
      <circle cx="6" cy="6" r="3.5" fill="#f59e0b"/>
      <text x="18" y="10" class="body-text">
        <tspan class="bold-text">Cơ chế:</tspan> Thanh kim loại kép (Bimetal strip)
      </text>

      <!-- Bullet 2 -->
      <circle cx="6" cy="38" r="3.5" fill="#f59e0b"/>
      <text x="18" y="42" class="body-text">
        <tspan class="bold-text">Thời gian:</tspan> Trễ (giây → phút) tích tụ nhiệt I²t
      </text>

      <!-- Bullet 3 -->
      <circle cx="6" cy="70" r="3.5" fill="#f59e0b"/>
      <text x="18" y="74" class="body-text">
        <tspan class="bold-text">Ngưỡng tác động:</tspan> 1.13 I<tspan font-size="9" dy="2">n</tspan><tspan font-size="12.5" dy="-2"> ÷ 1.45 I</tspan><tspan font-size="9" dy="2">n</tspan>
      </text>
      
      <!-- Highlight box -->
      <rect x="0" y="95" width="300" height="26" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3 3"/>
      <text x="150" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24">
        Bảo vệ cáp dẫn không bị nóng chảy cách điện
      </text>
    </g>
  </g>

  <!-- Right Card: BẢO VỆ NGẮN MẠCH (Magnetic Short Circuit) -->
  <g transform="translate(420, 120)">
    <rect width="340" height="210" rx="14" fill="url(#magneticGrad)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.8"/>
    
    <!-- Header Badge -->
    <rect x="16" y="16" width="308" height="36" rx="8" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="36" cy="34" r="10" fill="#3b82f6"/>
    <path d="M 32 29 L 40 34 L 32 39 Z" fill="#ffffff"/>
    <text x="56" y="32" class="card-title" fill="#60a5fa">BẢO VỆ NGẮN MẠCH</text>
    <text x="56" y="44" class="card-sub" fill="#3b82f6">Dòng sự cố ngắn mạch vọt cực lớn</text>

    <!-- Details Bullet Points -->
    <g transform="translate(20, 75)">
      <!-- Bullet 1 -->
      <circle cx="6" cy="6" r="3.5" fill="#3b82f6"/>
      <text x="18" y="10" class="body-text">
        <tspan class="bold-text">Cơ chế:</tspan> Cuộn dây điện từ (Solenoid coil)
      </text>

      <!-- Bullet 2 -->
      <circle cx="6" cy="38" r="3.5" fill="#3b82f6"/>
      <text x="18" y="42" class="body-text">
        <tspan class="bold-text">Thời gian:</tspan> Tức thời (&lt; 10 ms ÷ 20 ms)
      </text>

      <!-- Bullet 3 -->
      <circle cx="6" cy="70" r="3.5" fill="#3b82f6"/>
      <text x="18" y="74" class="body-text">
        <tspan class="bold-text">Ngưỡng tác động:</tspan> Theo bội số I<tspan font-size="9" dy="2">n</tspan><tspan font-size="12.5" dy="-2"> (Curve B, C, D, K, Z)</tspan>
      </text>

      <!-- Highlight box -->
      <rect x="0" y="95" width="300" height="26" rx="6" fill="#3b82f6" fill-opacity="0.1" stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="3 3"/>
      <text x="150" y="112" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="700" fill="#60a5fa">
        Dập dội hồ quang &amp; ngắt dòng tức thì
      </text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 160" width="100%" height="100%">
  <defs>
    <linearGradient id="multiBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    
    <!-- Curve Colors -->
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <style>
    .axis-title { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 800; fill: #94a3b8; letter-spacing: 0.5px; }
    .curve-name { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 800; fill: #ffffff; }
    .curve-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; opacity: 0.9; }
    .multiplier-val { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 700; fill: #cbd5e1; }
  </style>

  <!-- Container -->
  <rect width="840" height="160" rx="14" fill="url(#multiBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="420" y="26" text-anchor="middle" class="axis-title">BỘI SỐ DÒNG CẮT TỪ TÍNH TỨC THỜI (I / I<tspan font-size="9" dy="2">n</tspan><tspan font-size="13" dy="-2">)</tspan></text>

  <!-- Central Axis Bar -->
  <line x1="40" y1="90" x2="800" y2="90" stroke="#475569" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- Curve Pill 1: Z Curve (2 - 3 In) -->
  <g transform="translate(45, 55)">
    <rect width="110" height="50" rx="10" fill="url(#zGrad)"/>
    <text x="55" y="24" text-anchor="middle" class="curve-name">Curve Z</text>
    <text x="55" y="40" text-anchor="middle" class="curve-desc">2 ÷ 3 I<tspan font-size="8" dy="1">n</tspan></text>
  </g>

  <!-- Curve Pill 2: B Curve (3 - 5 In) -->
  <g transform="translate(200, 55)">
    <rect width="110" height="50" rx="10" fill="url(#bGrad)"/>
    <text x="55" y="24" text-anchor="middle" class="curve-name">Curve B</text>
    <text x="55" y="40" text-anchor="middle" class="curve-desc">3 ÷ 5 I<tspan font-size="8" dy="1">n</tspan></text>
  </g>

  <!-- Curve Pill 3: C Curve (5 - 10 In) -->
  <g transform="translate(355, 55)">
    <rect width="125" height="50" rx="10" fill="url(#cGrad)"/>
    <text x="62.5" y="24" text-anchor="middle" class="curve-name">Curve C</text>
    <text x="62.5" y="40" text-anchor="middle" class="curve-desc">5 ÷ 10 I<tspan font-size="8" dy="1">n</tspan> (Phổ biến)</text>
  </g>

  <!-- Curve Pill 4: K Curve (8 - 12 In) -->
  <g transform="translate(525, 55)">
    <rect width="110" height="50" rx="10" fill="url(#kGrad)"/>
    <text x="55" y="24" text-anchor="middle" class="curve-name">Curve K</text>
    <text x="55" y="40" text-anchor="middle" class="curve-desc">8 ÷ 12 I<tspan font-size="8" dy="1">n</tspan></text>
  </g>

  <!-- Curve Pill 5: D Curve (10 - 20 In) -->
  <g transform="translate(680, 55)">
    <rect width="115" height="50" rx="10" fill="url(#dGrad)"/>
    <text x="57.5" y="24" text-anchor="middle" class="curve-name">Curve D</text>
    <text x="57.5" y="40" text-anchor="middle" class="curve-desc">10 ÷ 20 I<tspan font-size="8" dy="1">n</tspan></text>
  </g>

  <!-- Connecting arrows/dots below -->
  <g transform="translate(0, 130)">
    <text x="100" y="10" text-anchor="middle" class="multiplier-val">Vi Mạch / PLC</text>
    <text x="255" y="10" text-anchor="middle" class="multiplier-val">Tải Trở / Cáp Dài</text>
    <text x="417" y="10" text-anchor="middle" class="multiplier-val" fill="#60a5fa">Dân Dụng / Tải Hỗn Hợp</text>
    <text x="580" y="10" text-anchor="middle" class="multiplier-val">Mạch Điều Khiển</text>
    <text x="737" y="10" text-anchor="middle" class="multiplier-val">Động Cơ / Biến Áp</text>
  </g>
</svg>

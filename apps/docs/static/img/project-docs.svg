<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240" style="background:#0f172a">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="240" fill="url(#g1)"/>

  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="40" x2="400" y2="40" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="400" y2="80" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="400" y2="120" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="400" y2="160" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="80" y1="0" x2="80" y2="240" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="160" y1="0" x2="160" y2="240" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="240" stroke="#94a3b8" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="240" stroke="#94a3b8" stroke-width="0.5"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="340" cy="50" r="60" fill="#3b82f6" opacity="0.06"/>
  <circle cx="60" cy="190" r="45" fill="#8b5cf6" opacity="0.06"/>

  <!-- Book icon -->
  <g transform="translate(55, 55)" filter="url(#glow)">
    <rect x="0" y="0" width="100" height="130" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="8" y="8" width="84" height="114" rx="3" fill="#0f172a" stroke="#475569" stroke-width="0.5"/>
    <!-- Book spine -->
    <rect x="0" y="0" width="12" height="130" rx="3" fill="url(#g2)"/>
    <!-- Text lines in book -->
    <rect x="22" y="22" width="55" height="3" rx="1.5" fill="#3b82f6" opacity="0.6"/>
    <rect x="22" y="32" width="62" height="2" rx="1" fill="#475569" opacity="0.5"/>
    <rect x="22" y="40" width="50" height="2" rx="1" fill="#475569" opacity="0.4"/>
    <rect x="22" y="48" width="58" height="2" rx="1" fill="#475569" opacity="0.3"/>
    <!-- Code block in book -->
    <rect x="22" y="60" width="62" height="40" rx="3" fill="#020617" stroke="#334155" stroke-width="0.5"/>
    <rect x="28" y="68" width="30" height="2" rx="1" fill="#22d3ee" opacity="0.7"/>
    <rect x="28" y="74" width="45" height="2" rx="1" fill="#a78bfa" opacity="0.5"/>
    <rect x="34" y="80" width="38" height="2" rx="1" fill="#34d399" opacity="0.5"/>
    <rect x="34" y="86" width="28" height="2" rx="1" fill="#fbbf24" opacity="0.4"/>
    <!-- More text -->
    <rect x="22" y="108" width="45" height="2" rx="1" fill="#475569" opacity="0.3"/>
  </g>

  <!-- Floating document pages -->
  <g transform="translate(190, 40)" opacity="0.9">
    <!-- Page 1 (back) -->
    <rect x="20" y="10" width="80" height="100" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" transform="rotate(8, 60, 60)"/>
    <!-- Page 2 (front) -->
    <rect x="10" y="5" width="80" height="100" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" transform="rotate(-3, 50, 55)"/>
    <rect x="20" y="18" width="50" height="2.5" rx="1" fill="#60a5fa" opacity="0.6" transform="rotate(-3, 50, 55)"/>
    <rect x="20" y="26" width="60" height="2" rx="1" fill="#475569" opacity="0.4" transform="rotate(-3, 50, 55)"/>
    <rect x="20" y="32" width="45" height="2" rx="1" fill="#475569" opacity="0.3" transform="rotate(-3, 50, 55)"/>
    <rect x="20" y="38" width="55" height="2" rx="1" fill="#475569" opacity="0.3" transform="rotate(-3, 50, 55)"/>
  </g>

  <!-- PLC/Ladder diagram mini -->
  <g transform="translate(280, 100)" opacity="0.7">
    <rect x="0" y="0" width="90" height="70" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="45" y="14" text-anchor="middle" fill="#64748b" font-size="7" font-family="monospace">LADDER</text>
    <line x1="10" y1="25" x2="80" y2="25" stroke="#475569" stroke-width="0.5"/>
    <!-- Ladder rungs -->
    <line x1="10" y1="32" x2="25" y2="32" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="25" y="28" width="14" height="8" rx="1" fill="none" stroke="#22d3ee" stroke-width="1"/>
    <line x1="39" y1="32" x2="55" y2="32" stroke="#22d3ee" stroke-width="1.5"/>
    <circle cx="61" cy="32" r="5" fill="none" stroke="#34d399" stroke-width="1"/>
    <line x1="66" y1="32" x2="80" y2="32" stroke="#22d3ee" stroke-width="1.5"/>

    <line x1="10" y1="47" x2="20" y2="47" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="20" y="43" width="14" height="8" rx="1" fill="none" stroke="#a78bfa" stroke-width="1"/>
    <line x1="27" y1="43" x2="27" y2="51" stroke="#a78bfa" stroke-width="1"/>
    <line x1="34" y1="47" x2="55" y2="47" stroke="#a78bfa" stroke-width="1.5"/>
    <rect x="55" y="43" width="18" height="8" rx="1" fill="none" stroke="#fbbf24" stroke-width="1"/>
    <text x="64" y="49" text-anchor="middle" fill="#fbbf24" font-size="5" font-family="monospace">TIM</text>
    <line x1="73" y1="47" x2="80" y2="47" stroke="#a78bfa" stroke-width="1.5"/>

    <line x1="10" y1="60" x2="80" y2="60" stroke="#475569" stroke-width="0.5"/>
  </g>

  <!-- Accent glow -->
  <circle cx="200" cy="120" r="100" fill="url(#g3)" opacity="0.15"/>

  <!-- Title -->
  <text x="200" y="215" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="bold" font-family="system-ui, sans-serif" letter-spacing="1">Shareme</text>
  <text x="200" y="232" text-anchor="middle" fill="#E5E5EA" font-size="10" font-family="system-ui, sans-serif">PLC • Inverter • HMI • Servo</text>
</svg>

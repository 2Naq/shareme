<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <text x="425" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="bold">QUY TRÌNH UPLOAD CHƯƠNG TRÌNH TỪ PLC OMRON VỀ MÁY TÍNH</text>

  <!-- Step 1 -->
  <g transform="translate(30, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="210" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="85" cy="30" r="16" fill="#2563eb"/>
    <text x="85" y="35" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">1</text>
    <text x="85" y="70" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">Auto Online</text>
    <text x="85" y="95" text-anchor="middle" fill="#cbd5e1" font-size="11">Mở CX-Programmer</text>
    <rect x="15" y="110" width="140" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="85" y="128" text-anchor="middle" fill="#94a3b8" font-size="10">PLC ➔ Auto Online</text>
    <text x="85" y="142" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="bold"> Direct Online</text>
    <text x="85" y="180" text-anchor="middle" fill="#94a3b8" font-size="10">Tự động nhận diện PLC</text>
  </g>

  <path d="M 210,170 L 230,170" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g transform="translate(235, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="210" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="85" cy="30" r="16" fill="#2563eb"/>
    <text x="85" y="35" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">2</text>
    <text x="85" y="70" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">Chọn Connection</text>
    <text x="85" y="95" text-anchor="middle" fill="#cbd5e1" font-size="11">Cửa sổ Direct Online</text>
    <rect x="15" y="110" width="140" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="85" y="128" text-anchor="middle" fill="#22c55e" font-size="10" font-weight="bold">● USB connection</text>
    <text x="85" y="142" text-anchor="middle" fill="#94a3b8" font-size="10">(hoặc Serial / Ethernet)</text>
    <rect x="40" y="162" width="90" height="24" rx="4" fill="#2563eb"/>
    <text x="85" y="178" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Connect</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(440, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="210" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <circle cx="85" cy="30" r="16" fill="#2563eb"/>
    <text x="85" y="35" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text>
    <text x="85" y="70" text-anchor="middle" fill="#38bdf8" font-size="13" font-weight="bold">Xác nhận Upload</text>
    <text x="85" y="95" text-anchor="middle" fill="#cbd5e1" font-size="11">Tải chương trình &amp; data</text>
    <rect x="15" y="110" width="140" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="85" y="128" text-anchor="middle" fill="#e2e8f0" font-size="10">Upload Options?</text>
    <text x="85" y="142" text-anchor="middle" fill="#38bdf8" font-size="10">Program + IO Table</text>
    <rect x="40" y="162" width="90" height="24" rx="4" fill="#16a34a"/>
    <text x="85" y="178" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Bấm YES</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(645, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="175" height="210" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <circle cx="87" cy="30" r="16" fill="#059669"/>
    <text x="87" y="35" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">4</text>
    <text x="87" y="70" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">Xem &amp; Lưu Code</text>
    <text x="87" y="95" text-anchor="middle" fill="#cbd5e1" font-size="11">Hoàn tất Upload</text>
    <rect x="15" y="110" width="145" height="40" rx="4" fill="#0f172a" stroke="#059669"/>
    <text x="87" y="128" text-anchor="middle" fill="#34d399" font-size="10" font-weight="bold">Upload Successful!</text>
    <text x="87" y="142" text-anchor="middle" fill="#94a3b8" font-size="10">Project Tree ➔ Section1</text>
    <text x="87" y="180" text-anchor="middle" fill="#f59e0b" font-size="10">Mở Ladder Diagram</text>
  </g>
</svg>

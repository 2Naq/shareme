<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%" style="background-color: #0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <text x="425" y="30" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="bold">QUY TRÌNH DOWNLOAD CHƯƠNG TRÌNH TỪ MÁY TÍNH XUỐNG PLC OMRON</text>

  <!-- Step 1 -->
  <g transform="translate(30, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="210" rx="8" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="85" cy="30" r="16" fill="#db2777"/>
    <text x="85" y="35" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">1</text>
    <text x="85" y="70" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="bold">Biên dịch Code</text>
    <text x="85" y="95" text-anchor="middle" fill="#cbd5e1" font-size="11">Kiểm tra lỗi syntax</text>
    <rect x="15" y="110" width="140" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="85" y="128" text-anchor="middle" fill="#f472b6" font-size="12" font-weight="bold">Nhấn phím F7</text>
    <text x="85" y="142" text-anchor="middle" fill="#94a3b8" font-size="10">(Compile Program)</text>
    <text x="85" y="180" text-anchor="middle" fill="#22c55e" font-size="10">0 Errors, 0 Warnings</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(235, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="210" rx="8" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="85" cy="30" r="16" fill="#db2777"/>
    <text x="85" y="35" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">2</text>
    <text x="85" y="70" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="bold">Work Online</text>
    <text x="85" y="95" text-anchor="middle" fill="#cbd5e1" font-size="11">Kết nối trực tuyến</text>
    <rect x="15" y="110" width="140" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="85" y="128" text-anchor="middle" fill="#e2e8f0" font-size="10">PLC ➔ Work Online</text>
    <text x="85" y="142" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="bold">Ctrl + W</text>
    <rect x="40" y="162" width="90" height="24" rx="4" fill="#db2777"/>
    <text x="85" y="178" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Bấm YES</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(440, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="170" height="210" rx="8" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5"/>
    <circle cx="85" cy="30" r="16" fill="#db2777"/>
    <text x="85" y="35" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text>
    <text x="85" y="70" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="bold">Transfer To PLC</text>
    <text x="85" y="95" text-anchor="middle" fill="#cbd5e1" font-size="11">Nạp chương trình</text>
    <rect x="15" y="110" width="140" height="40" rx="4" fill="#0f172a" stroke="#334155"/>
    <text x="85" y="128" text-anchor="middle" fill="#e2e8f0" font-size="10">PLC ➔ Transfer</text>
    <text x="85" y="142" text-anchor="middle" fill="#f59e0b" font-size="10" font-weight="bold">➔ To PLC (Ctrl+T)</text>
    <rect x="40" y="162" width="90" height="24" rx="4" fill="#2563eb"/>
    <text x="85" y="178" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Bấm OK</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(645, 65)" filter="url(#shadow)">
    <rect x="0" y="0" width="175" height="210" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2"/>
    <circle cx="87" cy="30" r="16" fill="#059669"/>
    <text x="87" y="35" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">4</text>
    <text x="87" y="70" text-anchor="middle" fill="#34d399" font-size="13" font-weight="bold">Chuyển Mode RUN</text>
    <text x="87" y="95" text-anchor="middle" fill="#cbd5e1" font-size="11">Xác nhận thực thi</text>
    <rect x="15" y="110" width="145" height="40" rx="4" fill="#0f172a" stroke="#059669"/>
    <text x="87" y="128" text-anchor="middle" fill="#34d399" font-size="10" font-weight="bold">Download Successful</text>
    <text x="87" y="142" text-anchor="middle" fill="#eab308" font-size="10">Return to RUN Mode?</text>
    <rect x="42" y="162" width="90" height="24" rx="4" fill="#16a34a"/>
    <text x="87" y="178" text-anchor="middle" fill="#fff" font-size="11" font-weight="bold">Bấm YES</text>
  </g>
</svg>

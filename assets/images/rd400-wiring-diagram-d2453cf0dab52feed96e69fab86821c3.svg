  <!-- LEFT ANNOTATIONS & BRACKETS -->
  <!-- Power -->
  <path d="M 410 109 L 385 109 L 385 136 L 360 136 L 385 136 L 385 155 L 410 155" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
  <line x1="360" y1="132" x2="310" y2="132" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowPower)"/>
  
  <g transform="translate(35, 92)">
    <rect x="0" y="0" width="265" height="76" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="12" y="24" fill="#f59e0b" font-size="15" font-weight="bold">Nguồn Cấp (Power Supply)</text>
    <text x="12" y="44" fill="#cbd5e1" font-size="13">AC 100 ~ 240V (50/60 Hz)</text>
    <text x="12" y="62" fill="#94a3b8" font-size="12">Tùy chọn: AC 24V hoặc DC 24V</text>
  </g>

  <!-- OUT2 -->
  <path d="M 410 201 L 385 201 L 385 224 L 360 224 L 385 224 L 385 247 L 410 247" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <line x1="360" y1="224" x2="310" y2="224" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowOUT)"/>

  <g transform="translate(35, 184)">
    <rect x="0" y="0" width="265" height="80" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

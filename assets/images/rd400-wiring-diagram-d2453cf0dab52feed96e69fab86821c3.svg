    <text x="12" y="22" fill="#c084fc" font-size="14" font-weight="bold">Ngõ Vào Đo Lường PV (Sensor)</text>
    <text x="12" y="42" fill="#cbd5e1" font-size="12">TC (Can nhiệt): K, J, R, S, B, E, N, T...</text>
    <text x="12" y="58" fill="#cbd5e1" font-size="12">RTD (Nhiệt điện trở): Pt100, JPt100</text>
    <text x="12" y="74" fill="#cbd5e1" font-size="12">Điện áp / Dòng điện: mV, V, 4-20mA</text>
    <text x="12" y="94" fill="#64748b" font-size="11">[Chân 10: +, Chân 11: -, Chân 12: B/Shield]</text>
  </g>


    <text x="12" y="42" fill="#cbd5e1" font-size="12">Rơ le (1) / Xung áp (SSR) / 4-20mA</text>
    <text x="12" y="58" fill="#cbd5e1" font-size="12">Điện áp 0-10V / Triac / Open Collector</text>
    <text x="12" y="73" fill="#64748b" font-size="11">[Xem chi tiết Mục P. 3-9]</text>
  </g>

  <!-- OUT1 -->
  <path d="M 410 293 L 385 293 L 385 316 L 360 316 L 385 316 L 385 339 L 410 339" fill="none" stroke="#0ea5e9" stroke-width="2.5"/>
  <line x1="360" y1="316" x2="310" y2="316" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowOUT)"/>

  <g transform="translate(35, 276)">
    <rect x="0" y="0" width="265" height="80" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="12" y="22" fill="#38bdf8" font-size="14" font-weight="bold">Ngõ Ra Điều Khiển 1 (OUT1)</text>

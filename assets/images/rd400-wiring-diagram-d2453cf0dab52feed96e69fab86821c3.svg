  <!-- Title Header -->
  <text x="500" y="38" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing="0.5">
    SƠ ĐỒ ĐẤU NỐI CHÂN TERMINAL - RKC RD400 / RD SERIES
  </text>
  <text x="500" y="58" text-anchor="middle" fill="#94a3b8" font-size="13">
    Áp dụng cho các dòng đồng hồ nhiệt độ RKC RD100, RD400, RD500, RD700, RD900
  </text>


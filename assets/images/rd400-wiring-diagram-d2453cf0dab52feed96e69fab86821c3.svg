    <rect x="0" y="0" width="265" height="82" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
    <text x="12" y="22" fill="#34d399" font-size="14" font-weight="bold">Ngõ Ra Số DO1 &amp; DO2 *</text>

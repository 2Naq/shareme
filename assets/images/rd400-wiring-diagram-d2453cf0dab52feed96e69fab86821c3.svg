    <text x="12" y="58" fill="#cbd5e1" font-size="12">Chân 14: T/R(A) | Chân 15: T/R(B)</text>
    <text x="12" y="74" fill="#94a3b8" font-size="11">Giao thức: RKC Communication / Modbus-RTU</text>
  </g>


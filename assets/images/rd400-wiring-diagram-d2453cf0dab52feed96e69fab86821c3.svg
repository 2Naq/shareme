  <line x1="640" y1="569" x2="690" y2="569" stroke="#facc15" stroke-width="2" marker-end="url(#arrowCT)"/>

  <g transform="translate(695, 528)">
    <rect x="0" y="0" width="270" height="92" rx="8" fill="#1e293b" stroke="#facc15" stroke-width="1.5"/>
    <text x="12" y="22" fill="#facc15" font-size="14" font-weight="bold">Ngõ Vào Biến Dòng CT1 &amp; CT2 *</text>
    <text x="12" y="42" fill="#cbd5e1" font-size="12">Chân 22: COM (Chung)</text>
    <text x="12" y="58" fill="#cbd5e1" font-size="12">Chân 23: CT1 | Chân 24: CT2</text>
    <text x="12" y="74" fill="#94a3b8" font-size="11">Đo dòng tải &amp; cảnh báo đứt dây đốt HBA</text>
